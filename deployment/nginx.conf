# Static-only container; shared Traefik handles domain routing and HTTPS.

# Cache policy by path. Computed here so a single server-level add_header can set it:
# an add_header inside a location would silently drop every inherited security header.
# Only /assets/ is safe to cache forever -- Vite content-hashes those filenames.
map $uri $isaee_cache {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
    ~^/og/         "public, max-age=604800";
}

server {
    listen 80 default_server;
    server_name _;
    root /srv/site/current;
    index index.html;
    server_tokens off;

    # Canonical host: send www to the apex (canonical link already points there).
    if ($host = www.isaee.xyz) { return 301 https://isaee.xyz$request_uri; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/rss+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Restored from the pre-migration .htaccess: both were lost moving to nginx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Isaee-Origin digitalocean always;
    add_header Cache-Control $isaee_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://m.media-amazon.com https://*.clarity.ms https://c.bing.com; connect-src 'self' https://generativelanguage.googleapis.com https://*.clarity.ms; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
}
