# Static-only container; shared Traefik handles domain routing and HTTPS.
server {
    listen 80 default_server;
    server_name _;
    root /srv/site/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Isaee-Origin digitalocean always;
    add_header Cache-Control no-cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://m.media-amazon.com; connect-src 'self' https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
}
