name: Deploy isaee.xyz to DigitalOcean
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isaee-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit sorting implementations
        run: |
          node research/sorting/audit.mjs
          node research/sorting/journey-audit.mjs
      - name: Build static website
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ''
      - name: Upload and activate release
        env:
          DEPLOY_KEY: ${{ secrets.ISAEE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ISAEE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/isaee
          chmod 600 ~/.ssh/isaee
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh -i ~/.ssh/isaee -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes isaee-deploy@167.71.232.107
      - name: Verify the deployed release
        run: |
          set -euo pipefail
          BASE=http://167.71.232.107
          get() { curl --fail --silent --show-error --retry 3 --retry-delay 3 "$@"; }

          # Article renders and carries its current headline.
          get "$BASE/interactive-blogs/ai-text-watermarking/" -o /tmp/article.html
          grep -q 'Why you cannot see a watermark in AI text' /tmp/article.html

          # The explainer assets must be referenced and reachable, or the page
          # renders while every interactive figure is silently dead.
          grep -q 'explainer.js' /tmp/article.html
          get -o /dev/null "$BASE/interactive-blogs/ai-text-watermarking/explainer.js"
          get -o /dev/null "$BASE/interactive-blogs/ai-text-watermarking/explainer.css"

          # The site CSP is script-src 'self', so every <script> must either load
          # from src= or be a non-executable JSON-LD data block. An inline script
          # would be blocked at runtime with no build-time error.
          if grep -o '<script[^>]*>' /tmp/article.html \
             | grep -v -e 'src=' -e 'application/ld+json' | grep -q .; then
            echo "Inline <script> found; CSP script-src 'self' would block it." >&2
            exit 1
          fi

          # Rest of the site still serves.
          for path in / /interactive-blogs/ /robots.txt /sitemap.xml; do
            get -o /dev/null "$BASE$path"
          done
          curl --fail --retry 3 --retry-delay 3 http://167.71.232.107/interactive-blogs/sorting/ -o /tmp/sorting.html
          grep -q 'This looks wrong' /tmp/sorting.html
          for asset in scroll-story.js scroll-story.css journey.js journey-model.js journey.css landscape.svg vendor/anime.esm.min.js; do
            get -o /dev/null "$BASE/interactive-blogs/sorting/$asset"
          done
